name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://flowpilot-demo.vercel.app

      - name: Smoke test production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3210 > /tmp/flowpilot-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3210 >/dev/null; then
              break
            fi
            sleep 1
          done
          SMOKE_BASE_URL=http://127.0.0.1:3210 npm run test:smoke
        env:
          NEXT_PUBLIC_SITE_URL: https://flowpilot-demo.vercel.app
